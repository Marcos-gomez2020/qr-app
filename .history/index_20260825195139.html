<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de códigos QR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h1>Generador de códigos QR</h1>
        <hr>
        
    <div class="container">
       <!-- <div style="text-align: center;">
            <img src="images/Logo_1.png" alt="" style="width: 120px">
        </div>-->
       

        <div class="column_1">
             <h2 class="" style="color: #4099FF;font-weight: 300;">1. Ingresa la información</h2>
              <div class="" style="height: 20px;"></div>
        <form id="utm-form">
            <div class="form-group">
                <label for="base-url">Ingresa la url*</label>
               <input type="url" id="text" placeholder="https://www.ejemplo.com" autocomplete="url" required>
            </div>
          <div class="form-group">
                <label for="tamaño">Tamaño</label>
                <input type="number" name="size" id="size" placeholder="Tamaño (px)" min="100" max="1000" step="50" value="400">
            </div>
            <div class="form-group">
                <label for="utm-source">Formato</label>
                <select id="format" style="font-weight: bold; width: 100%;padding: 15px;border-color: #4099FF;font-size: 15px;border-radius: 4px;background-color: #fefefe;color: #000;">
                 <!--   <option value="" disable selected>Selecciona el formato</option>-->
                    <option value="png">PNG</option>
                    <option value="jpg">JPG</option>
                    <option value="svg">SVG</option>
                </select>
            </div>
            <button type="button" id="generate">Generar QR</button>
        </form>
        </div>

        <div class="column_2">
            <h2 class="" style="color: #4099FF;font-weight: 300;">2. Descargar el código QR</h2>
            <div class="" style="height: 20px;"></div>
            <div id="qrcode-div" style="text-align: center;">
            <div class="qrcode" style="display: flex; justify-content: center; align-items: center;margin:auto">
                <img class="" id="qrcode" src="" alt="" style="width: 300px;border-radius: 10px;">
            </div>
             <button class="btn-descargar" id="download" type="button">Descargar QR<i class="fa-solid fa-download" style="padding-left: 5px;"></i></button>
        </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
